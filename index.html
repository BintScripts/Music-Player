<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/logo.png" />
</head>
<body>
  <div class="music-card">
    <div class="song-info">
      <div class="album-art">
        <img src="images/logo.png" alt="Song Cover">
        <div class="audio-visualization">
          <div class="bar bar1"></div>
          <div class="bar bar2"></div>
          <div class="bar bar3"></div>
          <div class="bar bar4"></div>
          <div class="bar bar5"></div>
        </div>
      </div>
      <div class="song-title">
        <h2 class="title">The ultimate SUBSCRIBE button</h2>
        <p class="artist">BintScripts</p>
      </div>
    </div>
    <div class="progress-container">
      <span class="time current-time">0:00</span>
      <div class="progress-bar">
        <div class="progress"></div>
      </div>
      <span class="time total-time">0:00</span>
    </div>
    <div class="controls">
      <button class="control-btn volume-btn">
        <svg class="volume-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-4 0l-4.26 4.26.05.05c-1.13.92-1.84 2.27-1.84 3.79 0 1.52.71 2.87 1.84 3.79l-.05.05 4.26 4.26v-16.2z"/>
        </svg>
      </button>
      <div class="volume-slider">
        <div class="volume-track">
          <div class="volume-fill"></div>
          <div class="volume-handle"></div>
        </div>
      </div>
      <button class="control-btn skip-back">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>
      <button class="control-btn play-pause">
        <svg class="play-icon" viewBox="0 0 24 24" width="32" height="32">
          <path class="play-path" d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button class="control-btn skip-forward">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
      <button class="control-btn favorite">
        <svg class="heart-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>
    </div>
  </div>
  <audio id="audio">
    <source src="assets/song.mp3" type="audio/mpeg">
  </audio>
  <script src="script.js"></script>
</body>
</html>
